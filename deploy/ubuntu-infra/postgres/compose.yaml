services:
  postgres:
    image: postgres:17.2
    container_name: birdnet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: birdnet
      POSTGRES_USER: birdnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - birdnet-postgres-data:/var/lib/postgresql/data
      - ../../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U birdnet -d birdnet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  birdnet-postgres-data:
