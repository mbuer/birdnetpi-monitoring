services:
  loki:
    image: grafana/loki:3.5.5
    container_name: birdnet-loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/local-config.yaml

    ports:
      - "3100:3100"

    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - birdnet-loki-data:/loki

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3100/ready || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  birdnet-loki-data:
